name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Default is 6 hours. Nothing here should take more than a fraction of
    # that, and a stuck job should fail fast rather than hold a runner.
    timeout-minutes: 90
    # Persist vcpkg's built packages in the GitHub Actions cache so dependencies
    # are built from source only once, then restored on later runs.
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      # Hash the relative path, not the absolute one: CMake bakes the build
      # directory into some generated sources (innoextract's autogen files
      # among them), which would otherwise miss whenever the path moves.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: "locale,time_macros,include_file_ctime,include_file_mtime"
    strategy:
      # One platform failing shouldn't hide results from the other two.
      fail-fast: false
      matrix:
        include:
          # SDL2, OSG and MyGUI are all in noble, so ubuntu-latest is fine
          # here -- no need for a newer image the way an SDL3 project needs.
          - os: ubuntu-latest
            name: Linux (GCC)
          - os: macos-latest
            name: macOS (Clang)
          - os: windows-latest
            name: Windows (MSVC)

    steps:
      - uses: actions/checkout@v4

      # Everything opendf needs is packaged in Debian/Ubuntu, launcher included.
      # Boost and liblzma are for the innoextract the launcher builds alongside
      # itself (src/launcher/CMakeLists.txt).
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential \
            libopenscenegraph-dev libmygui-dev libsdl2-dev \
            libgl1-mesa-dev qt6-base-dev \
            libboost-iostreams-dev libboost-filesystem-dev \
            libboost-date-time-dev libboost-program-options-dev liblzma-dev

      # Homebrew has open-scene-graph and qt, but:
      #   * no mygui formula at all -- it has to be built from source (below)
      #   * no sdl2 formula either; it was replaced by sdl2-compat, which is
      #     an SDL2 API/ABI shim over SDL3 and installs the same sdl2.pc and
      #     SDL2 headers find_package(SDL2) looks for.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja open-scene-graph sdl2-compat qt freetype \
            boost xz

      # Cache the installed MyGUI tree so the source build below only happens
      # when the version changes. The key carries the tag, so bumping
      # MyGUI3.4.4 automatically misses and rebuilds.
      - name: Cache MyGUI (macOS)
        if: runner.os == 'macOS'
        id: cache-mygui
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mygui-install
          key: mygui-${{ runner.os }}-MyGUI3.4.4

      # MyGUI from source, since Homebrew dropped it. Only MyGUIEngine is
      # needed: opendf brings its own OSG-backed RenderManager/DataManager
      # (src/opendf/gui/gui.cpp) rather than using a MyGUI render platform,
      # so the demos, tools, docs and platform libs are all switched off and
      # this stays a short build.
      #
      # MYGUI_RENDERSYSTEM=1 is the "Dummy" platform. The default is 3 (Ogre),
      # which would drag in an Ogre dependency we have no use for.
      - name: Build MyGUI from source (macOS)
        if: runner.os == 'macOS' && steps.cache-mygui.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch MyGUI3.4.4 \
            https://github.com/MyGUI/mygui.git "$RUNNER_TEMP/mygui"
          cmake -S "$RUNNER_TEMP/mygui" -B "$RUNNER_TEMP/mygui/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mygui-install" \
            -DMYGUI_RENDERSYSTEM=1 \
            -DMYGUI_BUILD_DEMOS=OFF \
            -DMYGUI_BUILD_TOOLS=OFF \
            -DMYGUI_BUILD_PLUGINS=OFF \
            -DMYGUI_BUILD_DOCS=OFF \
            -DMYGUI_BUILD_UNITTESTS=OFF \
            -DMYGUI_BUILD_TEST_APP=OFF
          cmake --build "$RUNNER_TEMP/mygui/build" --target install

      # Expose the GitHub Actions cache endpoint/token to vcpkg's x-gha binary
      # source (set via VCPKG_BINARY_SOURCES above).
      - name: Export GitHub Actions cache variables (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Cache the whole vcpkg tree (tool + installed/). On a hit we skip clone,
      # bootstrap and install entirely -- osg alone is a long build from source.
      # The key carries a MANUAL version (-vN): bump it when the install command
      # below changes (new port, different triplet, ...). Deliberately not
      # hashFiles() over this workflow, so unrelated CI edits don't throw away a
      # large, perfectly good cache. x-gha still helps on a miss by restoring
      # per-package binaries instead of rebuilding them.
      # restore + a separate always-run save (rather than actions/cache, which
      # only saves at the end of a SUCCESSFUL job): a run that fails or times
      # out mid-install would otherwise cache nothing, and the next run would
      # start from zero again.
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg
          key: vcpkg-${{ runner.os }}-v3-osgcore-mygui-sdl2-boost-lzma
          restore-keys: |
            vcpkg-${{ runner.os }}-v3-

      # cmake, ninja and git are preinstalled on the windows-latest image, so we
      # only need vcpkg. Qt6 comes from install-qt-action below rather than
      # vcpkg's qtbase, which is a 45+ minute from-source build.
      #
      # osg[core]: osg's default features (plugins, openexr, nvtt, fontconfig)
      # exist for GIS and film formats we never touch, and drag in gdal, hdf5,
      # netcdf, proj, openssl, libpq and friends -- 119 ports in the transitive
      # closure against 68 without them, all built from source on a cache miss.
      # We only load PNG (the three MyGUI skin images; Daggerfall's own art
      # comes out of the BSAs via our loader) and need freetype for text, so
      # ask for exactly those.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:USERPROFILE\vcpkg
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          & "$env:USERPROFILE\vcpkg\vcpkg.exe" install osg[core] freetype libpng mygui sdl2 `
              boost-iostreams boost-filesystem boost-date-time boost-program-options `
              liblzma --triplet x64-windows

      # Save whatever vcpkg produced, even if a later step fails, so progress
      # is never thrown away. always() also covers the cancelled/timed-out case.
      - name: Save vcpkg cache
        if: always() && runner.os == 'Windows' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg
          key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      # Ensure Ninja is on PATH for later steps. (gha-setup-ninja registers it
      # via $GITHUB_PATH, which -- unlike choco -- propagates across steps.)
      - name: Set up Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      # Prebuilt Qt6 for the launcher; sets Qt6_DIR + PATH so find_package(Qt6)
      # succeeds and BUILD_LAUNCHER=AUTO picks it up.
      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      # The Ninja generator needs cl.exe on PATH, which requires the MSVC
      # developer environment to be activated.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Compiler caching: ccache hashes preprocessor output + flags and returns
      # the cached object on a hit, so an unchanged TU recompiles in
      # milliseconds. ccache 4.x supports MSVC, so one setup covers all three
      # platforms; CMake is pointed at it via CMAKE_*_COMPILER_LAUNCHER below.
      # This also covers the innoextract the launcher builds -- FetchContent
      # puts it under build/_deps in the same tree, so the launcher applies.
      #
      # 1G rather than the default: the engine, the launcher and innoextract
      # all share this cache.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}
          max-size: 1G

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # macOS: point CMake at the brewed Qt/OSG and the MyGUI we built
          # above. Linux gets everything from apt, so it needs no extra hints.
          # An array, not a string: CMAKE_PREFIX_PATH is a ;-separated list, and
          # word-splitting a bare string containing ';' is asking for trouble.
          EXTRA_ARGS=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS+=("-DCMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix open-scene-graph);$RUNNER_TEMP/mygui-install")
            # cmake/FindMyGUI.cmake hints off $ENV{MYGUI_HOME} -- an environment
            # variable, so a -DMYGUI_HOME= would be silently ignored.
            export MYGUI_HOME="$RUNNER_TEMP/mygui-install"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_LAUNCHER=ON \
            "${EXTRA_ARGS[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DBUILD_LAUNCHER=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:USERPROFILE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      # opendf has no test suite yet, so the build itself is the check. Once
      # tests land, add a ctest step here.

      # Keep the binaries from each platform so a PR can be smoke-tested
      # without rebuilding locally.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: opendf-${{ matrix.os }}
          path: |
            build/opendf
            build/bsatool
            build/opendf-launcher
            build/opendf.exe
            build/bsatool.exe
            build/opendf-launcher.exe
          if-no-files-found: warn
